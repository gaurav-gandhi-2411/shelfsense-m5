[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shelfsense"
version = "0.1.0"
description = "Production-grade M5 demand forecasting pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pandas>=2.0",
    "numpy>=1.24",
    "lightgbm>=4.6",
    "optuna>=4.8",
    "pyarrow>=14.0",
    "pandera>=0.20",
    "dagster>=1.7,<1.9.3",
    "mlflow>=2.0",
]

[project.scripts]
shelfsense = "shelfsense.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-forked>=1.6",
    "pytest-xdist>=3.5",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.8",
    "pre-commit>=3.7",
    "dvc[gdrive]>=3.50",
    "dagster-webserver>=1.7,<1.9.3",
]
dl = [
    "darts==0.44.0",
    "torch>=2.0",
    "pytorch-lightning>=2.0",
]
submission = [
    "kaggle==2.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["shelfsense"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "--tb=short -q"
markers   = [
    "forked: run test in a subprocess (requires pytest-forked); isolates memory between heavy Dagster materializations",
]

[tool.coverage.run]
source = ["shelfsense"]
omit   = [
    # Phase-1 narrative code — not on the production inference path
    "shelfsense/models/classical/*",
    "shelfsense/data/dl_format_adapter.py",
    "shelfsense/data/vram_utils.py",
    "shelfsense/visualization/*",
    # Dagster asset bodies (dagster.materialize calls) only run under
    # RUN_CLI_INTEGRATION=1; unit-test coverage is structurally capped here.
    "shelfsense/orchestration/assets.py",
    "scripts/*",
    "scripts/legacy/*",
]

[tool.coverage.report]
fail_under = 60
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["scripts/legacy/"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# Long run_config dicts and assertion strings in test/integration files are
# hard to wrap without losing readability — E501 is tolerated there.
"tests/**" = ["E501"]
# Dagster asset bodies contain long type annotations and config chains.
"shelfsense/orchestration/assets.py" = ["E501"]
# Phase-1 classical model wrappers are archival — not actively maintained.
"shelfsense/models/classical/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
ignore_missing_imports = true
check_untyped_defs = false
