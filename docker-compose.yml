# ShelfSense M5 local development stack.
#
# Services:
#   train    — shelfsense CLI / pipeline runner (shelfsense:dev image).
#              Not a daemon; invoke with: docker compose run --rm train <command>
#              Started on-demand via profile "tools" — not included in `up`.
#   mlflow   — experiment tracking UI on :5000  (ghcr.io/mlflow/mlflow:v2.22.0)
#   dagster  — pipeline orchestration UI on :3000 (built from Dockerfile.dagster,
#              dagster==1.10.4 + dagster-webserver==1.10.4)
#
# Usage:
#   docker compose up -d                        # start mlflow + dagster
#   docker compose run --rm train --help        # run a CLI command
#   docker compose down                         # stop and remove containers

services:

  train:
    build: .
    image: shelfsense:dev
    volumes:
      - ./data:/app/data
      - ./mlruns:/app/mlruns
      - ./dagster_home:/app/dagster_home
    networks: [shelfsense-net]
    profiles: [tools]
    # Not a daemon — run with: docker compose run --rm train <shelfsense command>

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.0
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlruns/mlflow.db
      --default-artifact-root /mlruns
      --host 0.0.0.0
    networks: [shelfsense-net]

  dagster:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    ports:
      - "3000:3000"
    volumes:
      - ./dagster_home:/dagster_home
      - ./workspace.yaml:/workspace.yaml:ro
    environment:
      - DAGSTER_HOME=/dagster_home
    command: dagster-webserver -h 0.0.0.0 -p 3000 -w /workspace.yaml
    networks: [shelfsense-net]

networks:
  shelfsense-net:
    driver: bridge
